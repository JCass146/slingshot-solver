schema_version: 4

system:
  name: Dimensionless Jupiter Analog
  star_mass_msun: 1.0
  star_radius_rsun: 1.0
  planet_mass_mjup: 1.0
  planet_radius_rjup: 1.0
  bulk_velocity_x_kms: 0.0
  bulk_velocity_y_kms: 0.0

orbit:
  model: circular
  semi_major_axis_au: 1.0
  eccentricity: 0.0
  mean_anomaly_rad: 0.0
  argument_periapsis_rad: 0.0
  prograde: true

asymptotic_sampling:
  v_inf_kms: [10.0, 20.0, 30.0, 40.0, 60.0, 80.0, 120.0]
  b_max_au: 2.0
  boundary_radius_au: 10.0
  samples_per_bin: 2000
  seeds: [42, 43, 44, 45, 46]
  sample_incoming_direction: true
  sample_binary_mean_anomaly: true

planar_width:
  dimensionless_energy_thresholds: [0.0, 0.01, 0.03, 0.1, 0.3, 1.0]
  confidence_level: 0.95
  tail_fraction: 0.10
  max_tail_event_fraction: 0.01

numerical:
  method: DOP853
  rtol: 1.0e-10
  atol: 1.0e-10
  max_time_sec: 5.0e8
  softening_km: 0.0
  max_step_sec: null

validation:
  binary_elements_relative_tolerance: 1.0e-10
  two_body_deflection_relative_tolerance: 1.0e-6
  jacobi_relative_tolerance: 1.0e-8
  work_energy_relative_tolerance: 1.0e-6
  integrator_agreement_relative_tolerance: 1.0e-5
  run_rebound_if_available: true

metadata:
  case_name: dimensionless_jupiter_reference
  description: General planar star-planet reference expressed through dimensionless gain thresholds.
  parameter_source: Synthetic reference model
  citation: Internal reference configuration
  uncertainties: {}
  legacy_science_model: false
